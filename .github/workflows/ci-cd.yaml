name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run unit tests with coverage
        run: |
          cd app
          pytest test_main.py -v --cov=. --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.xml

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short commit SHA
        id: sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:latest \
                       app/

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|srinidhi1989/cloud-native-devops-aiops-platform:.*  # IMAGE_TAG|srinidhi1989/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }}  # IMAGE_TAG|g" k8s/deployment.yaml

      - name: Commit updated deployment.yaml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "sri31"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://sri31:${GH_TOKEN}@github.com/sri31/cloud-native-devops-aiops-platform.git
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ steps.sha.outputs.SHORT_SHA }}"
          git push origin main