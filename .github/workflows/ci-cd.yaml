# ──────────────────────────────────────────
# GitHub Actions CI/CD Pipeline
# Cloud Native DevOps AIOps Platform
# Author: sri31
# ──────────────────────────────────────────

name: CI/CD Pipeline

# ──────────────────────────────────────────
# Trigger — runs on every push to main
# ──────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ──────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────
jobs:

  # ────────────────────────────────────────
  # Job 1 — Test
  # ────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run unit tests with coverage
        run: |
          cd app
          pytest test_main.py -v --cov=. --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.xml

  # ────────────────────────────────────────
  # Job 2 — Build and Push Docker Image
  # ────────────────────────────────────────
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short commit SHA
        id: sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:latest \
                       app/

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloud-native-devops-aiops-platform:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|srinidhi1989/cloud-native-devops-aiops-platform:.*  # IMAGE_TAG|srinidhi1989/cloud-native-devops-aiops-platform:${{ steps.sha.outputs.SHORT_SHA }}  # IMAGE_TAG|g" k8s/deployment.yaml

      - name: Commit updated deployment.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: update image tag to ${{ steps.sha.outputs.SHORT_SHA }}"
          git push https://sri31:${{ secrets.GH_TOKEN }}@github.com/sri31/cloud-native-devops-aiops-platform.gitS